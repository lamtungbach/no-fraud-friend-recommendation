apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-service
  labels:
    app: trust-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trust-service
  template:
    metadata:
      labels:
        app: trust-service
    spec:
      containers:
      - name: trust-api
        image: no-fraud-trust-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: trust-service-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1536Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
