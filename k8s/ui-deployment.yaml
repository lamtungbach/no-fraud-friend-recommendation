apiVersion: apps/v1
kind: Deployment
metadata:
  name: pymk-ui
  labels:
    app: pymk-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pymk-ui
  template:
    metadata:
      labels:
        app: pymk-ui
    spec:
      containers:
      - name: streamlit-ui
        image: no-fraud-pymk-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
          name: http
        env:
        - name: PYMK_API_URL
          value: http://trust-service:8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10001
          seccompProfile:
            type: RuntimeDefault
