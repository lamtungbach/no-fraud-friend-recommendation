name: DevSecOps Security & Quality Gate

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  # 1. Quét Secret bằng Gitleaks
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Cần fetch toàn bộ git history để Gitleaks quét đầy đủ

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Quét SAST (Bandit) và Dependency Audit (pip-audit)
  security-audit:
    name: SAST & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Security Scanners & Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: SAST Code Scan (Bandit)
        run: |
          bandit -r src/ -ll

      - name: Dependency Vulnerability Scan (pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Run Automated Test Suite
        run: |
          python -m pytest
